name: Bug
description: Something does not work as intended.
labels: [bug, manual, triaged]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem, not a command to run. Never paste passwords, tokens or personal data
        (customer names, e-mail addresses, phone numbers, tax or ID numbers); describe such data instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, and who it hurts.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links (Sentry issue, CI run, PR, commit), file and line, screenshots without personal data.
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected area
      description: The product, app, page or service (for example the mobile app, the public web, the admin, the API).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: App, build or OTA version, platform, OS or browser, and when it happened.
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The expected and the actual behaviour, and numbered steps to reproduce.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Observable acceptance criteria, one per line.
